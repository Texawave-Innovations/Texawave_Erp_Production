name: CI

on:
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    # Postgres/Redis so apps/api's e2e suite (tenancy/permissions/auth — see
    # apps/api/test/reference-tags.e2e-spec.ts) can run for real, not just
    # typecheck. Credentials here are throwaway CI-only values, not secrets.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: texawave
          POSTGRES_PASSWORD: texawave
          POSTGRES_DB: texawave_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U texawave -d texawave_erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://texawave:texawave@localhost:5432/texawave_erp?schema=public"
      # A separate, empty database on the same service container — used only
      # by the migration-drift check below (`prisma migrate diff` needs a
      # shadow database to replay `prisma/migrations` into and compare
      # against schema.prisma). Never used by the app or the e2e suite.
      SHADOW_DATABASE_URL: "postgresql://texawave:texawave@localhost:5432/texawave_erp_shadow?schema=public"
      REDIS_URL: "redis://localhost:6379"
      # CI-only throwaway value — never the real secret, and never used
      # outside this ephemeral runner.
      JWT_SECRET: "ci-only-not-a-real-secret-do-not-reuse-1234567890"
      NODE_ENV: test
      LOG_LEVEL: warn
      CORS_ORIGIN: "http://localhost:3001"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create shadow database for migration-drift check
        run: |
          PGPASSWORD=texawave psql -h localhost -U texawave -d postgres \
            -c "CREATE DATABASE texawave_erp_shadow;"

      - name: Check schema.prisma and migrations/ haven't drifted
        # Fails the build if someone edited schema.prisma without running
        # `prisma migrate dev` to generate/commit a matching migration file
        # (Docs/CODING_STANDARDS.md §17 — database migrations need review,
        # and this is what actually enforces "the migration file matches the
        # schema" rather than trusting that by convention).
        run: |
          pnpm --filter @texawave-erp/database exec prisma migrate diff \
            --from-migrations ./prisma/migrations \
            --to-schema-datamodel ./prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - name: Apply database migrations
        run: pnpm --filter @texawave-erp/database exec prisma migrate deploy

      - name: Lint, typecheck, test, and build
        run: pnpm exec turbo run lint typecheck test build

      - name: Backend e2e tests (auth/tenancy/permissions)
        run: pnpm --filter api test:e2e

  # Browser e2e (Playwright) is intentionally NOT in this job yet — it needs
  # a running apps/api + seeded data + apps/ui dev/build server, which is
  # more setup than this workflow currently does. Run
  # `pnpm --filter ui test:e2e` locally against a real backend before a PR
  # that touches an authenticated UI flow (see Docs/CODING_STANDARDS.md §17).
